services:
  # --- 1. SERVICIOS DE LA APLICACIÓN ---
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: anglo_backend
    ports:
      - "8000:8000"
    environment:
      # Conexión por defecto a la base de datos Neon del proyecto.
      # Si existe un archivo .env con DATABASE_URL, se usa ese valor.
      DATABASE_URL: "${DATABASE_URL:-postgresql://neondb_owner:npg_dpW0xoNCE3KV@ep-aged-wave-b67ipotj-pooler.c-2.sa-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}"
      SECRET_KEY: "${SECRET_KEY:-anglo-electric-capstone-clave-de-desarrollo-2026}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
    restart: always

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: anglo_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

  # --- 2. HERRAMIENTAS DE BASE DE DATOS LOCAL (opcionales) ---
  db:
    image: postgres:16
    container_name: anglo_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: AngloElectric123
      POSTGRES_DB: anglo_electric_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: anglo_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@angloelectric.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

volumes:
  postgres_data: