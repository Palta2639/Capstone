version: '3.8'

services:
  # --- 1. SERVICIOS DE LA APLICACIÓN ---
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: anglo_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anglo_frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
    restart: always

  # --- 2. SERVICIOS DE BASE DE DATOS LOCAL---
  db:
    image: postgres:16
    container_name: anglo_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: AngloElectric123  
      POSTGRES_DB: anglo_electric_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: anglo_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@angloelectric.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

volumes:
  postgres_data: